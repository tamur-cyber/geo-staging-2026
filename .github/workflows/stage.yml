name: stage

# TRIGGERS -- and why `push` is NOT among them.
#
# The old workflow ran on `push: [main]` and carried
#     if: ${{ !contains(github.event.head_commit.message, '[data]') }}
# whose only job was to stop the workflow's own commit re-triggering it. That
# guard worked, but it made the loop safety depend on a string in a commit
# message that a human writes -- and this workflow still commits and pushes
# manifest.txt, so the loop is still reachable. Reasoning about it again:
#
#   * `workflow_dispatch` and `schedule` deliver NO head_commit, so the guard
#     evaluates `contains(null, '[data]')` -> false -> `!false` -> true. It is
#     inert on exactly the two triggers that remain.
#   * With `push` gone there is no self-trigger at all, so the guard has nothing
#     left to guard and is removed rather than left as dead logic that reads
#     like protection.
#   * Nothing is lost. This job fetches files from Statistics Canada; whether
#     somebody pushed a commit here has no bearing on whether those files
#     changed. A button plus a schedule covers every real reason to run it.
#
# IF YOU RE-ADD `push`, RE-ADD THE GUARD. The commit step below pushes to main,
# and without the guard that push starts the job again, forever.
on:
  workflow_dispatch:
  # Monthly. These are census geography reference files -- 92-151-X and
  # 92-156-X are census-cycle products and 17-10-0155 is annual, so nothing
  # here changes on a weekly horizon and a monthly check finds drift long
  # before anyone needs the data. Deliberately not at :00 and not on the 1st:
  # GitHub warns that runs scheduled on the hour are the most delayed, and the
  # start of a month is the busiest slot.
  schedule:
    - cron: '17 4 3 * *'   # 04:17 UTC on the 3rd of each month

permissions:
  contents: write          # needed to push manifest.txt AND to create the release

concurrency:
  # Two runs uploading assets to the same dated tag would race the collision
  # check. One at a time, and never cancel one mid-upload.
  group: stage-sources
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloads every pinned source to a temp directory, verifies each against
      # the size and sha256 in sources.json, and only then writes anything into
      # data/. Exits non-zero if ANY source fails, and on failure writes nothing
      # at all -- so a bad upstream can no longer overwrite good bytes, and can
      # no longer leave this job green.
      - name: fetch and verify pinned statcan sources
        run: ./scripts/stage-sources.sh

      # GIT HOLDS THE RECORD. manifest.txt is the provenance record and stays in
      # version control. The archives themselves are NOT added here any more --
      # they go to the release below.
      #
      # The files already committed under data/ are left exactly as they are:
      # nothing is removed, nothing is ignored, no history is rewritten. If a
      # re-fetch produces identical bytes, `git add manifest.txt` finds nothing
      # to commit and this step is a no-op.
      - name: commit the manifest
        run: |
          set -euo pipefail
          git config user.name  "staging-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.txt
          if git diff --cached --quiet; then
            echo "manifest unchanged; nothing to commit"
          else
            git commit -m "stage files [data]"
            git push
          fi

      # RELEASES HOLD THE BYTES. A pinned, dated tag -- never `latest`, because
      # /releases/latest/download/<file> resolves at request time and 404s as
      # soon as a newer release does not carry that exact filename.
      - name: publish the sources as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # minted per job; no stored secret
        run: ./scripts/publish-release.sh
